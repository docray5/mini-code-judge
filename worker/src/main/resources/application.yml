spring:
  application:
    name: worker
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        prefetch: 1

judge:
  queues:
    requests: judge.requests
    results: judge.results

sandbox:
  docker-host: ${DOCKER_HOST_URI:unix:///var/run/docker.sock}
  image: eclipse-temurin:21-jdk-alpine
  user: "65534:65534"
  label-key: "app.codejudge.sandbox"
  label-value: "true"
  cpus: 0.5
  memory-mb: 128
  pids-limit: 32
  number-of-files-limit: 64
  tmpfs-mb: 32
  heap-percentage: 80.0
  compile-timeout: 5s
  container-lifetime: 30s
  max-output-bytes: 65536
